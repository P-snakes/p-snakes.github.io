<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="将校内网址转为长沙理工大学 WebVPN 链接，收藏常用网站，查看转换记录。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>WebVPN 链接转换 · 长沙理工大学</title>
  <link rel="icon" type="image/svg+xml" href="./mark.svg">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" class="defs" aria-hidden="true">
  <defs>
    <symbol id="arrow-up" viewBox="0 0 24 24"><path d="M6 18 18 6M7 6h11v11"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-7-7 7 7-7 7"/></symbol>
    <symbol id="chain" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.72M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
    <symbol id="bookmark" viewBox="0 0 24 24"><path d="M6 20V5a1.5 1.5 0 0 1 1.5-1.5h9A1.5 1.5 0 0 1 18 5v15l-6-4z"/></symbol>
    <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.7"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16m-12 0V4h8v3m2 0-1 13H7L6 7m4 3v6m4-6v6"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
  </defs>
</svg>
<header class="top"><div class="top-inner">
  <a class="brand" href="./" aria-label="长理 WebVPN 首页"><img src="./mark.svg" width="30" height="30" alt="">长理 WebVPN</a>
  <a class="gateway" href="https://vpn.csust.edu.cn/" rel="noopener noreferrer" target="_blank">学校 VPN 入口 <svg class="icon"><use href="#arrow-up"/></svg></a>
</div></header>
<main class="shell">
  <section class="intro" aria-labelledby="title">
    <div><h1 id="title"><span lang="en">WebVPN</span> 链接转换</h1>
    <p>输入校内网址，生成长沙理工大学 WebVPN 访问链接。</p></div>
    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 180 104" fill="none">
        <defs><pattern id="dots" width="3.4" height="3.4" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#555"/></pattern></defs>
        <g transform="translate(89 52) rotate(-34)" stroke-linecap="round" stroke-linejoin="round">
          <rect x="-64" y="-18" width="74" height="36" rx="18" stroke="#202020" stroke-width="10"/>
          <rect x="-10" y="-18" width="74" height="36" rx="18" stroke="white" stroke-width="16"/>
          <rect x="-10" y="-18" width="74" height="36" rx="18" stroke="url(#dots)" stroke-width="10"/>
          <path d="M-16 18h8a18 18 0 0 0 16-10" stroke="#202020" stroke-width="10"/>
        </g>
      </svg>
    </div>
  </section>
  <form id="converter" class="panel">
    <label for="address" class="field-label">校内网址</label>
    <div class="input-row">
      <div class="address-wrap"><svg class="icon"><use href="#chain"/></svg><input id="address" name="url" type="text" inputmode="url" placeholder="输入校内网址或缩写，如 /xk" autocomplete="off" autocapitalize="none" spellcheck="false" required aria-describedby="address-error"></div>
      <button class="primary convert" type="submit" id="convert-button"><span>转换链接</span><svg class="icon"><use href="#arrow"/></svg></button>
    </div>
    <p id="address-error" class="error" role="alert" hidden></p>
    <div class="settings"><label class="toggle"><input id="auto" type="checkbox" role="switch"><span class="track"></span>转换后直接跳转</label>
      <div class="examples"><span>试一试</span><button type="button" data-example="https://www.csust.edu.cn/">学校官网</button><button type="button" data-example="http://10.255.65.52/">物理实验平台</button></div>
    </div>
  </form>
  <details class="shortcut-help">
    <summary>如何用地址栏直达？</summary>
    <p>在原网址前加上 <code>https://p-snakes.github.io/</code> 即可跳转。<a href="/https://www.csust.edu.cn/">试用学校官网直达链接 ↗</a></p>
  </details>
  <section id="result" class="result" aria-labelledby="result-label" hidden>
    <h2 id="result-label"><svg class="icon"><use href="#check"/></svg>转换结果</h2>
    <a id="result-link" class="output" rel="noreferrer"></a>
    <div class="actions"><a class="small solid" id="open-result" rel="noreferrer">打开链接 <svg class="icon"><use href="#arrow-up"/></svg></a>
      <button type="button" class="small" id="copy"><svg class="icon"><use href="#icon-copy"/></svg><span>复制</span></button>
      <button type="button" class="small" id="star"><svg class="icon"><use href="#bookmark"/></svg><span>收藏</span></button></div>
  </section>
  <nav class="shortcuts" aria-label="常用页面">
    <div class="shortcut-heading"><h2>常用页面</h2><a href="/go/">打开跳转页 ↗</a></div>
    <div id="shortcut-links" class="shortcut-links"></div>
  </nav>
  <section class="collection" aria-label="已保存的网站与记录">
    <div class="bar">
      <div class="tabs" role="tablist" aria-label="已保存的链接">
        <button id="tab-favorites" type="button" role="tab" aria-selected="true" aria-controls="items" data-view="favorites"><svg class="icon"><use href="#bookmark"/></svg>我的收藏<span class="count" hidden></span></button>
        <button id="tab-history" type="button" role="tab" aria-selected="false" aria-controls="items" tabindex="-1" data-view="history"><svg class="icon"><use href="#clock"/></svg>转换记录<span class="count" hidden></span></button>
      </div>
      <button id="manage" type="button" class="small"><svg class="icon"><use href="#plus"/></svg><span>添加收藏</span></button>
    </div>
    <div id="items" role="tabpanel" aria-labelledby="tab-favorites"></div>
  </section>
  <footer><span><svg class="icon"><use href="#lock"/></svg>收藏、记录和跳转偏好保存在此浏览器的 Cookie 中。</span><a href="https://github.com/P-snakes/p-snakes.github.io" target="_blank" rel="noopener noreferrer">GitHub <svg class="icon"><use href="#arrow-up"/></svg></a></footer>
</main>
<dialog id="favorite-dialog" aria-labelledby="dialog-title">
  <form id="favorite-form" class="modal">
    <div class="dialog-head"><h2 id="dialog-title">添加收藏</h2><button class="icon-btn" type="button" data-dismiss aria-label="关闭"><svg class="icon"><use href="#close"/></svg></button></div>
    <label for="fav-name">网站名称</label><input id="fav-name" type="text" maxlength="80" placeholder="例如：学校官网" required>
    <label for="fav-url">校内网址</label><input id="fav-url" type="text" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="https://www.csust.edu.cn" required>
    <p id="fav-error" class="error" role="alert" hidden></p>
    <div class="dialog-actions"><button type="button" class="small" data-dismiss>取消</button><button type="submit" class="primary">保存收藏</button></div>
  </form>
</dialog>
<dialog id="clear-dialog" aria-labelledby="clear-title"><div class="modal">
  <h2 id="clear-title">清空转换记录？</h2><p>此浏览器中的所有转换记录都将被删除。</p>
  <div class="dialog-actions"><button type="button" class="small" data-dismiss autofocus>取消</button><button class="primary" id="clear-history" type="button">清空记录</button></div>
</div></dialog>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<noscript>请启用 JavaScript 以在浏览器中转换链接。</noscript>
</body></html>
